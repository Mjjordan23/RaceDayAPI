name: Part 2 - Build and Test API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Locate solution file
        id: sln
        run: |
          SLN=$(find . -name "*.sln" | head -n 1)
          if [ -z "$SLN" ]; then
            echo "ERROR: no .sln file found in the repository."
            exit 1
          fi
          echo "Using solution: $SLN"
          echo "path=$SLN" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore "${{ steps.sln.outputs.path }}"

      - name: Build
        run: dotnet build "${{ steps.sln.outputs.path }}" --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test "${{ steps.sln.outputs.path }}" --no-build --configuration Release --verbosity normal
