name: Part 1 - Validate Repository Structure

# Runs on every push and pull request targeting main, and can also be triggered manually
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check ERD file exists (PNG or PDF)
        run: |
          if ! ls docs/*ERD*.png docs/*ERD*.pdf 1> /dev/null 2>&1; then
            echo "ERROR: No ERD file (PNG or PDF) found in /docs."
            exit 1
          fi
          echo "ERD file found."

      - name: Check API Endpoint Plan exists (PDF or Markdown)
        run: |
          if ! ls docs/*Endpoint*Plan*.pdf docs/*Endpoint*Plan*.md 1> /dev/null 2>&1; then
            echo "ERROR: No API Endpoint Plan file (PDF or Markdown) found in /docs."
            exit 1
          fi
          echo "API Endpoint Plan file found."

      - name: Check SQL script exists
        run: |
          if ! ls docs/*.sql 1> /dev/null 2>&1; then
            echo "ERROR: No .sql script found in /docs."
            exit 1
          fi
          echo "SQL script found."

      - name: Check README exists at repo root
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing at the repository root."
            exit 1
          fi
          echo "README.md found."

      
