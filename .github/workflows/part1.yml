name: Part 1 - Validate Repository Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check ERD file exists (PNG or PDF)
        run: |
          if ! find docs -maxdepth 1 -type f \( -iname "*ERD*.png" -o -iname "*ERD*.pdf" \) | grep -q .; then
            echo "ERROR: No ERD file (PNG or PDF) found in /docs."
            exit 1
          fi
          echo "ERD file found."

      - name: Check API Endpoint Plan exists (PDF or Markdown)
        run: |
          if ! find docs -maxdepth 1 -type f \( -iname "*Endpoint*Plan*.pdf" -o -iname "*Endpoint*Plan*.md" \) | grep -q .; then
            echo "ERROR: No API Endpoint Plan file (PDF or Markdown) found in /docs."
            exit 1
          fi
          echo "API Endpoint Plan file found."

      - name: Check SQL script exists (case-insensitive)
        run: |
          if ! find docs -maxdepth 1 -type f -iname "*.sql" | grep -q .; then
            echo "ERROR: No .sql script found in /docs."
            exit 1
          fi
          echo "SQL script found."

      - name: Check README exists at repo root
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing at the repository root."
            exit 1
          fi
          echo "README.md found."

      - name: All Part 1 required files present
        run: |
          echo "=========================================="
          echo "RaceDay Part 1 validation successful!"
          echo "=========================================="
          echo "All required files are present."
          echo "Repository structure meets Part 1 requirements."
