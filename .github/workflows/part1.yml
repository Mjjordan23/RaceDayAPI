name: RaceDay Part 1 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-part1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -f "docs/RaceDay ERD.pdf"
          test -f "docs/API Endpoint Plan.pdf"
          test -f "docs/RaceDayDB.sql"

      - name: Validate repository structure
        run: |
          test -d docs
          test -d .github/workflows

      - name: Part 1 validation successful
        run: echo "RaceDay Part 1 repository structure is valid."  
