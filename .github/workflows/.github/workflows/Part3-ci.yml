
name: Part 3 - Build and Test MVC Application

on:
  push:
    branches: [ main ]
    paths:
      - 'Part3/**'
      - '.github/workflows/Part3-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Part3/**'
      - '.github/workflows/Part3-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Part 3 solution
        run: dotnet restore Part3/RaceDayAPI.sln

      - name: Build Part 3 solution
        run: dotnet build Part3/RaceDayAPI.sln --no-restore --configuration Release

      - name: Run Part 3 unit tests
        run: dotnet test Part3/RaceDayAPI.sln --no-build --configuration Release --verbosity normal
